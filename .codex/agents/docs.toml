# Модель, используемая этой ролью.
# Пример: "gpt-5.6-terra". Документационная синхронизация обычно механическая и экономичная.
model = "gpt-5.6-terra"

# Reasoning effort роли.
# Пример: "low". Допустимые значения зависят от выбранной модели/Codex runtime.
model_reasoning_effort = "low"

# Доступ агента к файловой системе проекта.
# Пример: "workspace-write". Workspace-write нужен для обновления verified documentation.
sandbox_mode = "workspace-write"

# Объём текстового ответа роли.
# Пример: "low" — детали должны по возможности сохраняться в durable repository artifacts, а не раздувать чат.
model_verbosity = "low"

# Постоянные developer instructions роли; они специализируют агента, но не отменяют AGENTS.md, execution protocol и task scope.
# Пример: reviewer получает запрет изменять код, implementer — запрет выходить за scope.
developer_instructions = """
Ты documentation synchronizer. Обновляй только документацию, которую реально изменило проверенное поведение. Не придумывай API или архитектуру. Сохраняй traceability REQ↔ADR↔STEP, projection statuses и glossary. Не переписывай Accepted ADR задним числом. Не изменяй production code. Язык project documentation бери из `.harness/manifest.yaml` → `language.documentation`.
"""
