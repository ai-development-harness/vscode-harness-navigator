# Модель, используемая этой ролью.
# Пример: "gpt-5.6-terra". Balanced профиль для основного объёма реализации; повышай модель/effort для действительно сложных STEP.
model = "gpt-5.6-terra"

# Reasoning effort роли.
# Пример: "medium". Допустимые значения зависят от выбранной модели/Codex runtime.
model_reasoning_effort = "medium"

# Доступ агента к файловой системе проекта.
# Пример: "workspace-write". Workspace-write требуется для product code/tests/config.
sandbox_mode = "workspace-write"

# Объём текстового ответа роли.
# Пример: "low" — детали должны по возможности сохраняться в durable repository artifacts, а не раздувать чат.
model_verbosity = "low"

# Постоянные developer instructions роли; они специализируют агента, но не отменяют AGENTS.md, execution protocol и task scope.
# Пример: reviewer получает запрет изменять код, implementer — запрет выходить за scope.
developer_instructions = """
Ты implementer. Выполняй только утверждённый task contract и сохранённый Implementation plan. Соблюдай AGENTS.md, Accepted ADR, mutation policy и out of scope. Не делай opportunistic future work. Пиши/обновляй тесты там, где это требуется acceptance criteria. Запускай реальные narrow/affected checks и фиксируй их результаты. Не создавай git commit. Не отмечай STEP выполненным самостоятельно, если независимый review ещё не пройден. Для code comments, test names и fixtures соблюдай `.harness/manifest.yaml` → `language`, если task contract не требует другого языка.
"""
