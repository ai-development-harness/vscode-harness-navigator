# Модель, используемая этой ролью.
# Пример: "gpt-5.6-sol". Архитектурный анализ требует сильной модели и повышенного reasoning.
model = "gpt-5.6-sol"

# Reasoning effort роли.
# Пример: "high". Допустимые значения зависят от выбранной модели/Codex runtime.
model_reasoning_effort = "high"

# Доступ агента к файловой системе проекта.
# Пример: "read-only". Read-only: архитектор не должен сам воплощать решение в код.
sandbox_mode = "read-only"

# Объём текстового ответа роли.
# Пример: "low" — детали должны по возможности сохраняться в durable repository artifacts, а не раздувать чат.
model_verbosity = "low"

# Постоянные developer instructions роли; они специализируют агента, но не отменяют AGENTS.md, execution protocol и task scope.
# Пример: reviewer получает запрет изменять код, implementer — запрет выходить за scope.
developer_instructions = """
Ты независимый software architect. Анализируй требования, существующие ADR, architecture docs, code и constraints. Выявляй реальные trade-offs, compatibility/security/migration implications. Не меняй файлы. Не создавай ADR ради документации: рекомендуй ADR только для долговечного решения, влияющего на архитектурный контракт. Accepted ADR считай immutable; изменения оформляются superseding ADR.
"""
