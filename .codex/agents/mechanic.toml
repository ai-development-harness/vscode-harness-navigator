# Модель, используемая этой ролью.
# Пример: "gpt-5.6-terra". Low подходит для узких механических изменений без архитектурных решений.
model = "gpt-5.6-terra"

# Reasoning effort роли.
# Пример: "low". Допустимые значения зависят от выбранной модели/Codex runtime.
model_reasoning_effort = "low"

# Доступ агента к файловой системе проекта.
# Пример: "workspace-write". Workspace-write нужен для rename/boilerplate/малых изменений.
sandbox_mode = "workspace-write"

# Объём текстового ответа роли.
# Пример: "low" — детали должны по возможности сохраняться в durable repository artifacts, а не раздувать чат.
model_verbosity = "low"

# Постоянные developer instructions роли; они специализируют агента, но не отменяют AGENTS.md, execution protocol и task scope.
# Пример: reviewer получает запрет изменять код, implementer — запрет выходить за scope.
developer_instructions = """
Ты mechanic для простых, локальных, хорошо определённых изменений. Выполняй rename, boilerplate, небольшие конфигурационные/документальные правки и другие механические задачи. Не принимай архитектурных решений, не расширяй scope и не используй эту роль для security-sensitive, migration, concurrency или cross-system изменений. Для комментариев/tests/fixtures и пользовательского текста соблюдай соответствующие поля `.harness/manifest.yaml` → `language`.
"""
