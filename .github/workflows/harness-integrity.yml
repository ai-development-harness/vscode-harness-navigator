# Человекочитаемое имя workflow в GitHub Actions UI.
# Пример: "Harness Integrity".
name: Harness Integrity

# GitHub Actions events, на которых выполняется baseline Harness validation.
# Пример: push + pull_request + ручной workflow_dispatch.
on:
  # Проверять каждый push любой ветки.
  # Пример: commit в feature/* сразу получает Harness integrity result.
  push:
  # Проверять Pull Request до merge.
  # Пример: удаление обязательного protocol-файла блокируется ещё в PR.
  pull_request:
  # Разрешить ручной запуск workflow из GitHub UI/API.
  # Пример: повторная проверка после внешней настройки repository.
  workflow_dispatch:

# Минимальные GitHub token permissions всего workflow.
# Пример: только `contents: read`, потому что workflow ничего не публикует.
permissions:
  # Только чтение repository contents; validator ничего не коммитит и не пушит.
  # Пример: `read` достаточно для checkout и локальной проверки.
  contents: read

# Набор jobs workflow.
# Пример: один `validate-harness` job для baseline template.
jobs:
  # Стабильный machine-readable ID job.
  # Пример: `validate-harness` используется в branch protection/check names.
  validate-harness:
    # Отображаемое имя job в GitHub UI.
    # Пример: "Validate Harness".
    name: Validate Harness
    # Runner image для выполнения validation.
    # Пример: `ubuntu-latest`; конкретная версия Python задаётся отдельным setup step.
    runs-on: ubuntu-latest
    # Максимальное время job до принудительной остановки.
    # Пример: 5 минут существенно выше обычного времени validator, но защищает от зависания.
    timeout-minutes: 5

    # Последовательность шагов job.
    # Пример: checkout → setup Python → запуск dependency-free validator.
    steps:
      # Отображаемое имя checkout step.
      # Пример: "Checkout repository".
      - name: Checkout repository
        # Официальный action для получения contents текущего commit/PR.
        # Пример: actions/checkout@v7; обновляй major осознанно, не автоматически в рамках product STEP.
        uses: actions/checkout@v7
        # Параметры checkout action.
        # Пример: отключить сохранение credentials, так как workflow только читает repository.
        with:
          # Не оставлять GitHub token в локальном git config runner после checkout.
          # Пример: false снижает ненужные credentials в job, которому push не требуется.
          persist-credentials: false
          # Полная история нужна CI-gate неизменяемых review reports: validator
          # сравнивает итоговый commit/PR merge с его первым родителем.
          # Пример: изменение уже существующего REVIEW-*.md должно быть видно как M/D/R.
          fetch-depth: 0

      # Отображаемое имя шага настройки validator runtime.
      # Пример: "Setup Python".
      - name: Setup Python
        # Официальный action фиксирует major runtime вместо зависимости от случайного PATH runner image.
        # Пример: actions/setup-python@v7.
        uses: actions/setup-python@v7
        # Параметры Python runtime.
        # Пример: validator поддерживает Python 3.11+, CI использует стабильную ветку 3.13.
        with:
          # Версия Python для deterministic Harness validator.
          # Пример: "3.13".
          python-version: "3.13"

      # Отображаемое имя deterministic validation step.
      # Пример: видно как отдельная строка в Actions log.
      - name: Validate Harness integrity and repository hygiene
        # Команда baseline validator. Product-specific CI добавляется отдельными workflows после INIT.
        # Пример: `--mode ci` включает CI semantics без mutation.
        run: python3 .harness/tools/validate.py --mode ci

      # Отображаемое имя smoke-test command-reference checker.
      # Пример: подтверждает, что manifest-driven scan запускается на baseline template.
      - name: Validate command reference checker
        # Запустить реальный CLI; DRIFT является audit-data, BLOCKED/ошибка дают non-zero.
        # Пример: JSON output не нужен в CI log при успешном smoke-test.
        run: python3 .harness/tools/check-command-references.py --json >/dev/null

      # Synthetic regression configurable command-reference topology.
      # Пример: custom ADR directory остаётся historical-only, custom OQ/REQ/tasks сканируются.
      - name: Validate command reference paths
        # Synthetic regression manifest-driven scan topology.
        # Пример: custom ADR history исключается, а custom OQ/REQ/tasks остаются live scan surface.
        run: python3 .harness/tools/command-references-self-test.py
      # Отображаемое имя smoke-test публичного command structural gate.
      # Пример: подтверждает, что CLI принимает edge из graph и отвергает отсутствующий edge.
      - name: Validate command transition gate
        # Проверить публичный entry point на valid/invalid chain без runtime mutation.
        # Пример: publication chain проходит, обратный GIT PR → GIT COMMIT обязан вернуть non-zero.
        run: |
          python3 .harness/tools/validate-command.py --json -- 'GIT CHECK > COMMIT > PUSH > PR' >/dev/null
          if python3 .harness/tools/validate-command.py --json -- 'GIT PR > COMMIT' >/dev/null 2>&1; then
            echo "Expected INVALID_CHAIN for GIT PR > COMMIT"
            exit 1
          fi

      # Проверить единый local execution state на полном наборе canonical commands.
      # Пример: single/chain/STEP RUN, interruption, независимые команды и conditional transitions.
      - name: Validate execution status
        # Запуск dependency-free self-test на временном synthetic repository.
        # Пример: проверяет один execution-status.json и отсутствие per-STEP state files.
        run: python3 .harness/tools/execution-self-test.py

      # Проверить manifest-driven planning paths, transitive Plan basis и static blockers.
      # Пример: изменение linked REQ после PLAN обязано сделать Ready plan stale без LLM.
      - name: Validate planning contracts
        # Dependency-free synthetic regression suite для planning_contract.py.
        # Пример: проверяет dependency cycles, OPEN questions и custom taskDirectory.
        run: python3 .harness/tools/planning-contract-self-test.py

      # Проверить manifest/config boundary: language fallback/tags и manifest-driven Git policy.
      # Пример: произвольная строка вместо BCP 47 tag должна дать deterministic FAIL.
      - name: Validate Harness config contracts
        # Synthetic config regression не зависит от project stack.
        # Пример: custom repository.gitPolicy path реально загружается config layer.
        run: python3 .harness/tools/harness-config-self-test.py

      # Проверить schema contracts durable audit/release/skill-search reports.
      # Пример: candidate_count должен точно соответствовать shortlist #1..#N.
      - name: Validate durable report contracts
        # Synthetic reports не требуют внешней сети или product runtime.
        # Пример: malformed release verdict и incomplete skill shortlist дают FAIL.
        run: python3 .harness/tools/report-contract-self-test.py

      # Проверить repository-level fail-closed boundaries validator.
      # Пример: Git ignore semantics, ignored TOML и Codex config containment.
      - name: Validate repository hardening regressions
        # Synthetic checkout создаётся локально из tracked files текущего commit.
        # Пример: закомментированный AGENTS.local.md pattern обязан дать FAIL.
        run: python3 .harness/tools/repository-hardening-self-test.py

      # Проверить fail-closed schema/unknown-key behavior Git policy через публичный validator.
      # Пример: опечатка require_clean_worktre не должна молча игнорироваться.
      - name: Validate Git policy regression
        # Запустить fail-closed synthetic policy regression.
        # Пример: неизвестный safety key обязан дать non-zero validation.
        run: python3 .harness/tools/git-policy-self-test.py

      # Прогнать deterministic Git preflight на synthetic repository + bare remote.
      # Пример: protected branch, remote-ahead, publish/PR и ff-only sync проверяются без LLM.
      - name: Validate deterministic Git preflight
        # Запустить synthetic repository + bare remote lifecycle.
        # Пример: remote-ahead PUSH блокируется, clean behind-only SYNC получает ff-only plan.
        run: python3 .harness/tools/git-preflight-self-test.py

      # Прогнать настоящий deterministic updater на synthetic Git source/project.
      # Пример: 3-way merge, marker preservation, tag pinning и project-skill ownership.
      - name: Validate deterministic Harness update engine
        # Self-test не использует network: source releases создаются во временном локальном Git repository.
        # Пример: существующий project skill не может быть захвачен новым core skill молча.
        run: python3 .harness/tools/harness-update-self-test.py

      # Проверить исторически критичные update/migration invariants на synthetic legacy state.
      # Пример: routing/reload, relocation layout, project templates, ignored artifacts и deferred REQ migration.
      - name: Validate update migration regression
        # Dependency-free smoke test не запускает agent, а проверяет deterministic contract updater-а.
        # Пример: legacy v0.4.0 route обязан безопасно достигать текущего latest через v0.4.2 bridge.
        run: python3 .harness/tools/update-migration-self-test.py
