# Человекочитаемое имя workflow в GitHub Actions UI.
# Пример: "Harness Integrity".
name: Harness Integrity

# GitHub Actions events, на которых выполняется baseline Harness validation.
# Пример: pull_request в main и push в main после merge.
on:
  # Проверять Pull Request, направленный в main.
  # Пример: feature/token-budget → main запускает Harness Integrity.
  pull_request:
    # Ограничить base branch основной веткой проекта.
    # Пример: main.
    branches:
      - main
  # После merge PR GitHub создаёт push в main — это отдельная финальная проверка.
  # Пример: squash merge PR → push нового commit в main → Harness Integrity.
  push:
    # Не запускать CI для обычных push в feature/release-ветки.
    # Пример: только main.
    branches:
      - main

# Минимальные GitHub token permissions всего workflow.
# Пример: только `contents: read`, потому что workflow ничего не публикует.
permissions:
  # Только чтение repository contents; validator ничего не коммитит и не пушит.
  # Пример: `read` достаточно для checkout и локальной проверки.
  contents: read

# Не выполнять одновременно устаревшие проверки одного PR или устаревшие push-проверки main.
# Пример: второй commit в PR отменяет только предыдущую проверку того же PR.
concurrency:
  # PR группируются по номеру, push после merge — по ref основной ветки.
  # Пример: Harness Integrity-pull_request-74 и Harness Integrity-push-refs/heads/main.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  # Отменять устаревший запуск только для PR; проверка каждого merge commit в main
  # доводится до конца, иначе быстрый второй merge скрыл бы результат первого (#111).
  # Пример: true для pull_request, false для push в main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Набор jobs workflow.
# Пример: один `validate-harness` job для baseline template.
jobs:
  # Стабильный machine-readable ID job.
  # Пример: `validate-harness` используется в branch protection/check names.
  validate-harness:
    # Отображаемое имя job в GitHub UI.
    # Пример: "Validate Harness".
    name: Validate Harness
    # Runner image для выполнения validation; закреплён, чтобы смена `latest` не меняла CI молча (#111).
    # Пример: `ubuntu-24.04`; конкретная версия Python задаётся отдельным setup step.
    runs-on: ubuntu-24.04
    # Максимальное время job до принудительной остановки.
    # Пример: 5 минут существенно выше обычного времени validator, но защищает от зависания.
    timeout-minutes: 5

    # Последовательность шагов job.
    # Пример: checkout → setup Python → запуск dependency-free validator.
    steps:
      # Отображаемое имя checkout step.
      # Пример: "Checkout repository".
      - name: Checkout repository
        # Официальный action для получения contents текущего commit/PR.
        # Пример: actions/checkout@v7; обновляй major осознанно, не автоматически в рамках product STEP.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        # Параметры checkout action.
        # Пример: отключить сохранение credentials, так как workflow только читает repository.
        with:
          # Не оставлять GitHub token в локальном git config runner после checkout.
          # Пример: false снижает ненужные credentials в job, которому push не требуется.
          persist-credentials: false
          # Полная история нужна CI-gate неизменяемых review reports: validator
          # сравнивает итоговый commit/PR merge с его первым родителем.
          # Пример: изменение уже существующего REVIEW-*.md должно быть видно как M/D/R.
          fetch-depth: 0

      # Отображаемое имя шага настройки validator runtime.
      # Пример: "Setup Python".
      - name: Setup Python
        # Официальный action фиксирует major runtime вместо зависимости от случайного PATH runner image.
        # Пример: actions/setup-python@v7.
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        # Параметры Python runtime.
        # Пример: validator поддерживает Python 3.11+, CI использует стабильную ветку 3.13.
        with:
          # Версия Python для deterministic Harness validator.
          # Пример: "3.13".
          python-version: "3.13"

      # Отображаемое имя шага, который помечает изменения trust boundary в PR.
      # Пример: "Flag Harness trust boundary changes".
      - name: Flag Harness trust boundary changes
        # PR проверяется своим же validator-ом, поэтому ослабление validator/policy/CI
        # само себя не поймает (#111). Шаг не блокирует merge, а выводит warning-аннотацию,
        # чтобы reviewer (или CODEOWNERS проекта) явно проверил эти пути.
        # Пример: изменение `.harness/tools/validate.py` в PR даёт warning с именем файла.
        if: github.event_name == 'pull_request'
        # Параметры шага: SHA base и head из события PR.
        # Пример: BASE_SHA=abc123, HEAD_SHA=def456.
        env:
          # Commit base branch, от которого считается diff PR.
          # Пример: github.event.pull_request.base.sha.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # Проверяемый commit PR.
          # Пример: github.event.pull_request.head.sha.
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # Перечислить изменённые пути trust boundary и вывести GitHub warning на каждый.
        # Пример: `::warning file=.harness/harness-policy.toml::Harness trust boundary changed`.
        run: |
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- \
            '.harness/tools/' \
            '.harness/harness-policy.toml' \
            '.harness/harness-update.toml' \
            '.harness/git-policy.toml' \
            '.claude/settings.json' \
            '.codex/' \
            '.github/' |
          while IFS= read -r path; do
            echo "::warning file=${path}::Harness trust boundary changed; this PR is validated by its own validator, review manually"
          done

      # Отображаемое имя deterministic validation step.
      # Пример: видно как отдельная строка в Actions log.
      - name: Validate Harness integrity and repository hygiene
        # Команда baseline validator. Product-specific CI добавляется отдельными workflows после INIT.
        # Пример: `--mode ci` включает CI semantics без mutation.
        run: python3 .harness/tools/validate.py --mode ci

      # Отображаемое имя smoke-test command-reference checker.
      # Пример: подтверждает, что manifest-driven scan запускается на baseline template.
      - name: Validate command reference checker
        # Запустить реальный CLI; DRIFT является audit-data, BLOCKED/ошибка дают non-zero.
        # Пример: JSON output не нужен в CI log при успешном smoke-test.
        run: python3 .harness/tools/check-command-references.py --json >/dev/null

      # Отображаемое имя smoke-test публичного command structural gate.
      # Пример: подтверждает, что CLI принимает edge из graph и отвергает отсутствующий edge.
      - name: Validate command transition gate
        # Проверить публичный entry point на valid/invalid chain без runtime mutation.
        # Пример: publication chain проходит, обратный GIT PR → GIT COMMIT обязан вернуть non-zero.
        run: |
          python3 .harness/tools/validate-command.py --json -- 'GIT CHECK > COMMIT > PUSH > PR' >/dev/null
          python3 .harness/tools/validate-command.py --json -- 'STEP RUN 024' | grep -q 'STEP RUN STEP-024'
          python3 .harness/tools/validate-command.py --json -- 'HARNESS HELP' >/dev/null
          python3 .harness/tools/validate-command.py --json -- 'HARNESS STATUS' >/dev/null
          python3 .harness/tools/validate-command.py --json -- 'HARNESS RESUME' >/dev/null
          if python3 .harness/tools/validate-command.py --json -- 'HARNESS RESUME: exec-001' >/dev/null 2>&1; then
            echo "Expected HARNESS RESUME with arguments to be rejected"
            exit 1
          fi
          python3 .harness/tools/validate-command.py --json -- 'HARNESS DOCTOR' >/dev/null
          python3 .harness/tools/validate-command.py --json -- 'HARNESS CONFIG' >/dev/null
          python3 .harness/tools/validate-command.py --json -- 'STEP LIST' >/dev/null
          python3 .harness/tools/validate-command.py --json -- 'STEP SHOW 024' | grep -q 'STEP SHOW STEP-024'
          python3 .harness/tools/validate-command.py --json -- 'GIT PR FINISH' >/dev/null
          if python3 .harness/tools/validate-command.py --json -- 'STEP RUN 24' >/dev/null 2>&1; then
            echo "Expected invalid short STEP target for STEP RUN 24"
            exit 1
          fi
          if python3 .harness/tools/validate-command.py --json -- 'GIT PR > COMMIT' >/dev/null 2>&1; then
            echo "Expected INVALID_CHAIN for GIT PR > COMMIT"
            exit 1
          fi
          python3 .harness/tools/harness-help.py --json | grep -q '"canonical": "HARNESS HELP"'


      # Проверить deterministic operational UX поверх реального template checkout.
      # Пример: STATUS/CONFIG/DOCTOR/LIST должны вернуть PASS, synthetic test покрывает SHOW/RESUME.
      - name: Validate Harness UX commands
        # Запустить read-only UX smoke checks и отдельный synthetic regression.
        # Пример: optional gh/Claude/Codex не должны делать общий HARNESS DOCTOR failed.
        run: |
          python3 .harness/tools/harness-ux.py status --json | grep -q '"status": "PASS"'
          python3 .harness/tools/harness-ux.py config --json | grep -q '"status": "PASS"'
          python3 .harness/tools/harness-ux.py doctor --json | grep -q '"status": "PASS"'
          python3 .harness/tools/harness-ux.py step-list --json | grep -q '"status": "PASS"'

      # Запустить все synthetic regression tools, обнаруженные по *-self-test.py.
      # Пример: новый review-gates-self-test.py автоматически входит в CI без правки workflow.
      - name: Validate Harness synthetic self-tests
        # Runner продолжает suite после отдельного failure и печатает PASS/FAIL каждого файла.
        # Пример: итоговый HARNESS SELF-TESTS: PASS (14).
        run: python3 .harness/tools/run-self-tests.py

  # Targeted Windows coverage platform-specific safety boundaries.
  # Пример: msvcrt locking и taskkill не исполняются Linux job-ом.
  validate-windows-boundaries:
    # Отображаемое имя отдельного Windows compatibility job.
    # Пример: "Validate Windows boundaries".
    name: Validate Windows boundaries
    # Зафиксированный Windows runner для platform-specific Python branches.
    # Пример: windows-2025 вместо floating windows-latest.
    runs-on: windows-2025
    # Targeted suite обычно короткий; timeout защищает от зависших process tests.
    # Пример: 10 минут оставляет запас для update-engine fixtures.
    timeout-minutes: 10

    # Последовательность Windows-specific проверок.
    # Пример: checkout → Python → python3 shim → targeted self-tests.
    steps:
      # Получить exact commit/PR без сохранения push credentials.
      # Пример: checkout текущего PR commit.
      - name: Checkout repository
        # Официальный pinned checkout action.
        # Пример: actions/checkout@v7.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        # Параметры checkout для read-only validation.
        # Пример: credentials=false, full history.
        with:
          # Windows tests не выполняют provider mutation.
          # Пример: false.
          persist-credentials: false
          # Update/review regressions используют Git history.
          # Пример: 0 означает полную историю.
          fetch-depth: 0

      # Установить основной поддерживаемый Python runtime Windows.
      # Пример: Python 3.13.
      - name: Setup Python
        # Официальный pinned setup-python action.
        # Пример: actions/setup-python@v7.
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        # Параметры runtime setup.
        # Пример: python-version=3.13.
        with:
          # Версия targeted Windows runtime.
          # Пример: "3.13".
          python-version: "3.13"

      # Canonical Harness examples используют executable name python3.
      # Пример: создать shim к interpreter из setup-python.
      - name: Provide python3 command
        # Явный shell нужен для создания cmd shim на Windows.
        # Пример: pwsh.
        shell: pwsh
        # Создать python3.cmd и добавить каталог в PATH следующих steps.
        # Пример: python3 перенаправляется в exact pythonLocation.
        run: |
          $shim = Join-Path $env:RUNNER_TEMP "python3.cmd"
          $line = '@"{0}\python.exe" %*' -f $env:pythonLocation
          Set-Content -Path $shim -Value $line -Encoding ascii
          Add-Content -Path $env:GITHUB_PATH -Value $env:RUNNER_TEMP

      # Исполнить только branches, где Windows behavior отличается от POSIX.
      # Пример: locking/recovery/process termination/atomic writes.
      - name: Validate Windows-specific Harness boundaries
        # Явный shell стабилизирует Windows command semantics.
        # Пример: pwsh.
        shell: pwsh
        # Targeted regression set platform-sensitive tools.
        # Пример: execution, verification и update engine.
        run: |
          python .harness/tools/harness-config-self-test.py
          python .harness/tools/document-contract-self-test.py
          python .harness/tools/execution-self-test.py
          python .harness/tools/verification-self-test.py
          python .harness/tools/update-engine-self-test.py

  # Проверить нижнюю документированную границу Python отдельно от основного 3.13 job.
  # Пример: использование API, появившегося только в 3.12+, должно ломать этот job.
  validate-python-minimum:
    # Человекочитаемое имя compatibility gate.
    # Пример: "Validate Python 3.11 compatibility".
    name: Validate Python 3.11 compatibility
    # Linux runner совпадает с основным job, чтобы различалась только версия Python.
    # Пример: ubuntu-24.04.
    runs-on: ubuntu-24.04
    # Полный synthetic suite обычно укладывается существенно быстрее.
    # Пример: 5 минут защищают от regression/hang.
    timeout-minutes: 5

    # Последовательность minimum-version validation.
    # Пример: checkout → Python 3.11 → validator → discoverable self-tests.
    steps:
      # Получить exact commit и полную Git history для immutable report checks.
      # Пример: checkout текущего PR commit.
      - name: Checkout repository
        # Официальный pinned checkout action.
        # Пример: actions/checkout@v7.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        # Параметры read-only checkout.
        # Пример: credentials=false, full history.
        with:
          # Compatibility job не публикует изменения.
          # Пример: false.
          persist-credentials: false
          # Validator/review regressions используют commit ancestry.
          # Пример: 0.
          fetch-depth: 0

      # Установить минимальную поддерживаемую версию из DEPENDENCIES.md.
      # Пример: Python 3.11.
      - name: Setup minimum Python
        # Официальный pinned setup-python action.
        # Пример: actions/setup-python@v7.
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        # Параметры minimum runtime.
        # Пример: python-version=3.11.
        with:
          # Нижняя граница compatibility contract.
          # Пример: "3.11".
          python-version: "3.11"

      # Проверить dependency-free deterministic surface на minimum runtime.
      # Пример: validator + все discoverable synthetic self-tests.
      - name: Validate minimum Python compatibility
        # Выполнить тот же validator и regression runner на Python 3.11.
        # Пример: обе команды должны завершиться с exit code 0.
        run: |
          python3 .harness/tools/validate.py --mode ci
          python3 .harness/tools/run-self-tests.py
